# Projet Xcode généré par XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Le fichier .xcodeproj est créé automatiquement par GitHub Actions : rien à installer sur Windows.
name: Lemwincher
options:
  bundleIdPrefix: com.lemwincher
  # iOS 26 : design Liquid Glass (l'iPhone de l'utilisateur est en iOS 27).
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Lemwincher:
    type: application
    platform: iOS
    sources:
      - path: Lemwincher
      - path: Shared
    dependencies:
      # Minuteurs de cuisine dans la Dynamic Island (intégrée à l'app, dossier PlugIns).
      - target: LemwincherWidgets
    settings:
      base:
        PRODUCT_NAME: Lemwincher
        PRODUCT_BUNDLE_IDENTIFIER: com.lemwincher.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Clés générées automatiquement + Config/Lemwincher-Info.plist (tâche d'arrière-plan).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Lemwincher-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lemwincher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.shopping
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Lemwincher utilise votre position pour trouver les supermarchés et les stations-service autour de vous et comparer leurs prix."
        INFOPLIST_KEY_NSCameraUsageDescription: "La caméra sert à scanner les codes-barres, à lire les étiquettes de prix et les tickets de caisse."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        # Écran de lancement (citron sur fond vert) : clé UILaunchScreen de Config/Lemwincher-Info.plist.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Couleurs et images appelées par leur nom (Color("Brand")) : pas d'extensions générées
        # qui entreraient en conflit avec Color.brand.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Automatic

  # Extension : compte à rebours des minuteurs de cuisine (Dynamic Island, écran verrouillé).
  LemwincherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LemwincherWidgets
      - path: Shared
    info:
      path: LemwincherWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lemwincher
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lemwincher.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"

  # Tests unitaires (logique de calcul, analyse des données, formats).
  LemwincherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LemwincherTests
    dependencies:
      - target: Lemwincher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.lemwincher.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lemwincher.app/Lemwincher"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Tests d'interface : parcours de l'app sur simulateur, avec captures d'écran.
  LemwincherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LemwincherUITests
    dependencies:
      - target: Lemwincher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.lemwincher.app.uitests
        TEST_TARGET_NAME: Lemwincher

schemes:
  Lemwincher:
    build:
      targets:
        Lemwincher: all
        LemwincherTests: [test]
        LemwincherUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LemwincherTests
        - LemwincherUITests
    archive:
      config: Release
