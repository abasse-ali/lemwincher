name: Lemwincher
options:
  bundleIdPrefix: com.lemwincher
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Lemwincher:
    type: application
    platform: iOS
    sources:
      - path: Lemwincher
    settings:
      base:
        PRODUCT_NAME: Lemwincher
        PRODUCT_BUNDLE_IDENTIFIER: com.lemwincher.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Lemwincher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.shopping
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Lemwincher utilise votre position pour trouver les supermarchés autour de vous et comparer leurs prix."
        INFOPLIST_KEY_NSCameraUsageDescription: "La caméra sert à scanner le code-barres des produits pour comparer leurs prix."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Automatic

schemes:
  Lemwincher:
    build:
      targets:
        Lemwincher: all
    run:
      config: Debug
    archive:
      config: Release
